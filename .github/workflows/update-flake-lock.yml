name: Update flake.lock

# Dependabot does not cover Nix; this opens a PR with updated flake inputs.
# Opened as the release App, the PR runs CI by itself. Without the App, it
# falls back to GITHUB_TOKEN, whose PRs do not trigger other workflows: run
# CI on the PR with "Run workflow" (CI has workflow_dispatch) or close and
# reopen it.

on:
  schedule:
    - cron: "0 5 1 * *" # monthly
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      # With the release App (docs/development/releasing.md), the PR runs CI
      # by itself, including the release-script tests that guard a new
      # cargo-release. Without it, GITHUB_TOKEN as before.
      - name: Release App token
        id: app
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          commit-msg: "build(nix): update flake.lock"
          pr-title: "build(nix): update flake.lock"
          pr-labels: dependencies
