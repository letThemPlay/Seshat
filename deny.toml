# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run locally: `nix shell nixpkgs#cargo-deny -c cargo deny check`.

[graph]
# Seshat is Linux-only; don't judge Windows/macOS/wasm-only dependencies.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Vulnerabilities and unsound crates fail anywhere in the dependency graph;
# unmaintained crates only when a workspace crate depends on them directly.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses of dependencies, compatible with distributing Seshat
# under GPL-3.0-or-later (our own crates are unpublished and not checked).
# Only licenses actually used by the dependency tree are listed; adding one
# is a deliberate review decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # nucleo-matcher (Fuzzy Find, decision F1). File-level copyleft,
    # compatible with GPL-3.0-or-later.
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace use `workspace = true`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
