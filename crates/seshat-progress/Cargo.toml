[package]
name = "seshat-progress"
description = "Example D-Bus client: follows Seshat's file operations from another process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately independent of Seshat's crates (checked by
# scripts/check-architecture.sh): it speaks only the D-Bus protocol
# (docs/ipc/protocol.md), like a client in any other language.
[dependencies]
zbus.workspace = true
serde.workspace = true
futures-util = "0.3"

[dev-dependencies]
seshat-application.workspace = true
seshat-infrastructure.workspace = true
tempfile.workspace = true

[lints]
workspace = true
