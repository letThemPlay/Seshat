# Example Seshat theme. Copy to ~/.config/seshat/themes/nord.toml and pick
# "Nord" from the theme menu. Changes are picked up live.
name = "Nord"
extends = "dark"

[colors]
app_background = "#2e3440"
navigation_surface = "#2e3440"
surface = "#3b4252"          # content pane AND selected navigation item
text_primary = "#eceff4"
text_secondary = "#d8dee9"
text_muted = "#a3acbd"
accent = "#88c0d0"
border = "#4c566a"
hover = "#ffffff12"
selected = "#5e81ac66"
focus = "#88c0d0"
error = "#bf616a"
warning = "#ebcb8b"
success = "#a3be8c"

[geometry]
border_radius = 6

[typography]
font_family = "Inter"
font_size = 11
